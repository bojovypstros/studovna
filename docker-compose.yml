services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: studovna
      POSTGRES_PASSWORD: studovna
      POSTGRES_DB: studovna
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studovna -d studovna"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://studovna:studovna@db:5432/studovna
    volumes:
      - uploads:/app/storage
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
